name: upstream-discovery
display_name: "Discovery UPSTREAM"
version: "3.0.0"
description: "Agentes de descoberta, inventário e extração de lógica do ambiente legado"
agents:
  - id: discovery-scout
    file: agents/discovery-scout.md
    skill: dmf-discovery-scout
  - id: inventory-scout
    file: agents/inventory-scout.md
    skill: dmf-inventory-scout
  - id: data-strategist
    file: agents/data-strategist.md
    skill: dmf-data-strategist
  - id: business-analyst
    file: agents/business-analyst.md
    skill: dmf-business-analyst
  - id: logic-extractor
    file: agents/logic-extractor.md
    skill: dmf-logic-extractor
outputs:
  base_path: "projects/{project_name}/outputs/upstream"
  artifacts:
    - inventory.json
    - dependency-graph.json
    - dead-code-report.md
    - pseudocode/*.json
    - digital-twin.json
