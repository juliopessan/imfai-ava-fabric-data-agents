## Pipeline Architecture

### Medallion Architecture

```
[SOURCE FILES] 
    ↓
[LANDING LAYER - Bronze]
├── LND.{TABLE_1} (VARCHAR columns)
└── LND.{TABLE_2} (VARCHAR columns)
    ↓
[SILVER LAYER - Validated & Typed]
├── SILVER.{TABLE_1} (Proper types, quality checks)
└── SILVER.{TABLE_2} (Proper types, quality checks)
    ↓
[GOLD LAYER - Business Ready]
├── GOLD.{TABLE_1} (Enriched with joins)
└── GOLD.{TABLE_2} (Aggregated summaries)
```

## Table Definitions

### Landing Tables

#### LND.{TABLE_NAME}
**Purpose:** Raw ingestion of {source} data

| Column Name | Data Type | Description |
|-------------|-----------|-------------|
| col1 | VARCHAR(500) | {Description} |
| col2 | VARCHAR(500) | {Description} |
| load_timestamp | TIMESTAMP | When data was loaded |
| source_file | VARCHAR(500) | Source file name |

### Silver Tables

#### SILVER.{TABLE_NAME}
**Purpose:** Validated and typed data from {source}

| Column Name | Data Type | Nullable | Description |
|-------------|-----------|----------|-------------|
| col1 | INT | NO | {Description} |
| col2 | DECIMAL(10,2) | YES | {Description} |
| col3 | DATE | NO | {Description} |
| quality_flag | VARCHAR(50) | NO | VALID/INVALID indicator |
| processed_timestamp | TIMESTAMP | NO | Processing timestamp |

**Data Quality Rules:**
- `col1` must be positive integer
- `col2` must be between 0 and 10000
- `col3` must be valid date in format YYYY-MM-DD
- Rejects logged to REJECT.{TABLE_NAME}_REJECTS

### Gold Tables

#### GOLD.{TABLE_NAME}
**Purpose:** Business-ready dataset with enrichment

| Column Name | Data Type | Description |
|-------------|-----------|-------------|
| col1 | INT | {Description} |
| col1_desc | VARCHAR(200) | Description from REF table |
| col2 | DECIMAL(10,2) | {Description} |
| created_timestamp | TIMESTAMP | Record creation time |

**Business Logic:**
- Joined with REF.{TABLE_NAME} on col1
- Only includes VALID records from Silver
- Denormalized for query performance

#### GOLD.{AGG_TABLE_NAME}
**Purpose:** Aggregated summary data

| Column Name | Data Type | Description |
|-------------|-----------|-------------|
| group_column | VARCHAR(100) | Grouping dimension |
| total_count | BIGINT | Number of records |
| total_amount | DECIMAL(18,2) | Sum of amounts |
| avg_metric | DECIMAL(10,2) | Average metric value |

**Aggregation Logic:**
- GROUP BY {column}
- SUM of {columns}
- COUNT of records
- AVG of {columns}

## Data Flow

### Step 1: Ingestion (Landing)
```sql
-- Load CSV file into landing table
COPY LND.{TABLE_NAME}
FROM '{file_path}'
WITH (FORMAT CSV, HEADER true);
```

### Step 2: Transformation (Silver)
```sql
-- Transform to Silver with type casting and quality checks
INSERT INTO SILVER.{TABLE_NAME}
SELECT 
    CAST(col1 AS INT) as col1,
    CAST(col2 AS DECIMAL(10,2)) as col2,
    CAST(col3 AS DATE) as col3,
    CASE 
        WHEN col1 ~ '^[0-9]+$' AND col2::NUMERIC BETWEEN 0 AND 10000
        THEN 'VALID'
        ELSE 'INVALID'
    END as quality_flag,
    CURRENT_TIMESTAMP as processed_timestamp
FROM LND.{TABLE_NAME};
```

### Step 3: Enrichment (Gold)
```sql
-- Build Gold table with joins
INSERT INTO GOLD.{TABLE_NAME}
SELECT 
    s.col1,
    r.description as col1_desc,
    s.col2,
    CURRENT_TIMESTAMP as created_timestamp
FROM SILVER.{TABLE_NAME} s
LEFT JOIN REF.{REF_TABLE} r ON s.col1 = r.id
WHERE s.quality_flag = 'VALID';
```

