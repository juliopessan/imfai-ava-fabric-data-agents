wave_id: Financeiro-reference-2026-06
project_name: Financeiro — reference Migration Wave
description: Migration wave for legacy Cloudera assets to Databricks (proof-of-concept + phased roll-out)
discovery_owner: julio.cesar.d.pessan@company.example
discovery_owner_primary: julio.cesar.d.pessan@company.example
discovery_owner_secondary: data-architect@avanade.example
source_platform: cloudera
target_platform: databricks
migration_pattern: lift-and-shift
scope:
  - aaar-srv-calc-rentabilidade-script
  - aadg-srv-d4960-algoritmo-procedencia
  - dw-scripts
  - emr-packages
