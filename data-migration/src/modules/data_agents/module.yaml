code: data_agents
name: "Data & Agentic AI — BMAD-Data"
header: "Agentes e workflows para acelerar projetos de dados (UP→MID→DOWN) com gates e contratos"
subheader: "Framework BMAD-Data para pipelines, migração e modernização com auditabilidade e outputs versionáveis"
default_selected: false

# Core Config Variables (injected automatically):
# - user_name
# - communication_language
# - document_output_language
# - output_folder

# Custom variables
platform_target:
  prompt: "Qual plataforma alvo principal para o POC?"
  default: "databricks"
  result: "{value}"
  single-select:
    - value: "databricks"
      label: "Databricks (Spark SQL + PySpark)"
    - value: "snowflake"
      label: "Snowflake (SQL)"

project_code:
  prompt: "Qual o código curto do projeto/piloto (usado em nomes de artefatos)?"
  default: "trip-data-poc"
  result: "{value}"

artifacts_root:
  prompt: "Onde salvar os artefatos gerados (relativo ao projeto ou absoluto)?"
  default: "{output_folder}"
  result: "{value}"

enable_bi_agent:
  prompt: "Incluir o agente opcional de BI/Semantic Layer?"
  default: false
  result: "{value}"
