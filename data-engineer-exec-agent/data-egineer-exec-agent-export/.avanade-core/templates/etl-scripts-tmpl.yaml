# ETL Scripts Template

## Metadata
```yaml
project:
  name: "{PROJECT_NAME}"
  database: "{DATABASE_NAME}"
  technology: "{SQL|PySpark|Both}"
  
generator:
  name: "{Generator Name}"
  date: "{YYYY-MM-DD}"
  version: "1.0"
```

## Landing Layer ETL
```yaml
landing_etl:
  - script_name: "load-landing-{source}.sql"
    purpose: "Ingest raw data from {SOURCE_FORMAT}"
    source:
      type: "{CSV|Parquet|JSON|TSV}"
      location: "{file_path}"
      delimiter: "{delimiter}"
      header: "{true|false}"
      
    target:
      table: "LND.{SOURCE_NAME}"
      mode: "{TRUNCATE_INSERT|APPEND|MERGE}"
      
    operations:
      - "Read source file"
      - "Load all columns as VARCHAR"
      - "Capture load_timestamp"
      - "Capture source_file name"
      
    sql_pattern: |
      -- Load from {SOURCE_FORMAT} to Landing
      BULK INSERT LND.{SOURCE_NAME}
      FROM '{file_path}'
      WITH (
          FIELDTERMINATOR = '{delimiter}',
          ROWTERMINATOR = '\n',
          FIRSTROW = 2,
          TABLOCK
      );
```

## Silver Layer ETL
```yaml
silver_etl:
  - script_name: "transform-silver-{source}.sql"
    purpose: "Transform and validate data"
    source:
      table: "LND.{SOURCE_NAME}"
      
    target:
      valid_table: "SILVER.{SOURCE_NAME}"
      reject_table: "SILVER.{SOURCE_NAME}_REJECT"
      
    transformations:
      type_conversions:
        - column: "{column_name}"
          from_type: "VARCHAR"
          to_type: "{target_type}"
          conversion: "TRY_CAST / TRY_CONVERT"
          
      validations:
        - column: "{column_name}"
          rule: "NOT NULL"
          action: "REJECT if NULL"
          
        - column: "{column_name}"
          rule: "RANGE"
          min: "{min_value}"
          max: "{max_value}"
          action: "REJECT if out of range"
          
        - column: "{column_name}"
          rule: "REFERENTIAL"
          lookup_table: "REF.{TABLE}"
          action: "REJECT if not found"
          
    quality_assignment:
      valid_condition: "All validations pass"
      invalid_condition: "Any validation fails"
      
    sql_pattern: |
      -- Transform Landing to Silver with validation
      INSERT INTO SILVER.{SOURCE_NAME} (columns, quality_flag)
      SELECT 
          TRY_CAST(col1 AS target_type) AS col1,
          ...
          CASE 
              WHEN validation_fails THEN 'INVALID'
              ELSE 'VALID'
          END AS quality_flag
      FROM LND.{SOURCE_NAME};
      
      -- Capture rejects
      INSERT INTO SILVER.{SOURCE_NAME}_REJECT
      SELECT *, 'Validation reason', GETDATE()
      FROM SILVER.{SOURCE_NAME}
      WHERE quality_flag = 'INVALID';
```

## Gold Layer ETL
```yaml
gold_etl:
  enriched:
    - script_name: "build-gold-enriched.sql"
      purpose: "Create enriched, denormalized dataset"
      sources:
        - table: "SILVER.{SOURCE_NAME}"
          filter: "quality_flag = 'VALID'"
        - table: "REF.{LOOKUP_1}"
          join_type: "LEFT JOIN"
          join_key: "{key_column}"
          
      target:
        table: "GOLD.{PURPOSE}_ENRICHED"
        mode: "{TRUNCATE_INSERT|MERGE}"
        
      sql_pattern: |
        -- Build Gold Enriched
        TRUNCATE TABLE GOLD.{PURPOSE}_ENRICHED;
        
        INSERT INTO GOLD.{PURPOSE}_ENRICHED
        SELECT 
            s.*,
            r1.description AS lookup_1_desc,
            r2.description AS lookup_2_desc
        FROM SILVER.{SOURCE_NAME} s
        LEFT JOIN REF.{LOOKUP_1} r1 ON s.key = r1.code
        LEFT JOIN REF.{LOOKUP_2} r2 ON s.key = r2.code
        WHERE s.quality_flag = 'VALID';
        
  aggregated:
    - script_name: "build-gold-aggregated.sql"
      purpose: "Create aggregated metrics"
      source:
        table: "GOLD.{PURPOSE}_ENRICHED"
        
      target:
        table: "GOLD.{PURPOSE}_AGG"
        grain: "{aggregation_level}"
        
      aggregations:
        - metric: "total_count"
          function: "COUNT(*)"
        - metric: "total_amount"
          function: "SUM(amount)"
        - metric: "avg_amount"
          function: "AVG(amount)"
          
      sql_pattern: |
        -- Build Gold Aggregated
        TRUNCATE TABLE GOLD.{PURPOSE}_AGG;
        
        INSERT INTO GOLD.{PURPOSE}_AGG
        SELECT 
            dimension_column,
            COUNT(*) AS total_count,
            SUM(amount) AS total_amount,
            AVG(amount) AS avg_amount
        FROM GOLD.{PURPOSE}_ENRICHED
        GROUP BY dimension_column;
```

## Reference Data ETL
```yaml
reference_etl:
  - script_name: "load-reference-data.sql"
    purpose: "Load lookup/dimension tables"
    sources:
      - file: "{file.json}"
        format: "JSON"
        table: "REF.{TABLE_NAME}"
        
      - file: "{file.tsv}"
        format: "TSV"
        table: "REF.{TABLE_NAME}"
        
    sql_pattern: |
      -- Load JSON reference data
      INSERT INTO REF.{TABLE_NAME} (code, description)
      SELECT code, description
      FROM OPENJSON('{json_content}')
      WITH (code INT, description VARCHAR(100));
```

## Master Orchestration
```yaml
orchestration:
  script_name: "00-run-all-etl.sql"
  execution_order:
    - step: 1
      scripts: ["01-load-reference-data.sql"]
      description: "Load reference/lookup data"
      
    - step: 2
      scripts: ["02-load-landing-csv.sql", "03-load-landing-parquet.sql"]
      description: "Ingest raw data to Landing"
      parallel: true
      
    - step: 3
      scripts: ["04-transform-to-silver.sql"]
      description: "Transform and validate to Silver"
      
    - step: 4
      scripts: ["06-build-gold-enriched.sql"]
      description: "Build enriched Gold layer"
      
    - step: 5
      scripts: ["07-build-gold-aggregated.sql"]
      description: "Build aggregated Gold layer"
```
