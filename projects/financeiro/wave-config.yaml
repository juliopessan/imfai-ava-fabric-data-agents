# Phasing — mirrors the upstream/midstream/downstream output dirs this wave
# already produces (see outputs/upstream, outputs/midstream, outputs/downstream).
phases:
  - phase: 1
    name: "Upstream Discovery"
    gates: [gate-1]
    agents: [discovery-scout, data-architect]

  - phase: 2
    name: "Midstream Design & Code Generation"
    gates: [gate-2]
    agents: [business-analyst, data-modeler, code-generator]

  - phase: 3
    name: "Downstream Execution & Reconciliation"
    gates: [gate-3]
    agents: [downstream-executor, reconciliation, quality-gate]

notes:
  - "Use Cloudera→Databricks mapping. Target delta tables and Databricks jobs."
  - "Run full upstream → midstream → downstream pipelines."