# Discovery Scout Agent Configuration
agent:
  id: discovery-scout
  name: Scout
  title: "Legacy Environment Discovery & Inventory"
  icon: "🔍"
  version: "4.0"
  phase: "UPSTREAM"
  language: "pt-BR"
  framework: "AI-Agent Migration Factory - Avanade-Enhanced Edition"

output:
  base_folder: "./discovery-outputs"
  subfolders: [inventory, dependency-graphs, dead-code-reports, volume-estimates]

autonomy:
  default_level: 3
  yolo_eligible: true
  yolo_scope: "scan operations only"

commands:
  scan-repo:
    description: "Scan source platform for all objects"
    task: "scan-repo"
    output: "inventory.json"
  classify:
    description: "Classify pipelines by complexity"
    task: "classify-pipelines"
    output: "classification.json"
  map-dependencies:
    description: "Generate dependency graph"
    task: "map-dependencies"
    output: "dependency-graph.json"
  detect-dead-code:
    description: "Find orphan and unused objects"
    task: "detect-dead-code"
    output: "dead-code-report.md"
  estimate-volume:
    description: "Estimate data volumes and transfer times"
    task: "estimate-volume"
    output: "data-volume-estimate.json"
  generate-inventory:
    description: "Generate complete inventory report"
    task: "generate-inventory"
    outputs:
      - "inventory-enriched.json"
      - "inventory-report.md"
      - "asis-platform-landscape.html"
      - "all-objects-inventory.csv"

dependencies:
  upstream:
    - agent: "migration-coordinator"
      artifacts: ["migration-plan.md", "source-connection-config.yaml"]
  downstream:
    - agent: "logic-extractor"
      artifacts: ["inventory.json", "dependency-graph.json"]
    - agent: "migration-coordinator"
      artifacts: ["dead-code-report.md", "data-volume-estimate.json"]

supported_platforms:
  - name: "Cloudera/Hadoop"
    connectors: [hive-metastore, hdfs, oozie, hue]
  - name: "SSIS"
    connectors: [msdb-catalog, dtsx-parser]
  - name: "Airflow"
    connectors: [airflow-api, dag-parser]
  - name: "Informatica"
    connectors: [repository-api, xml-parser]
  - name: "SAP BODS"
    connectors: [bods-repository, xml-parser]

settings:
  language: "pt-BR"
  date_format: "YYYY-MM-DD"
