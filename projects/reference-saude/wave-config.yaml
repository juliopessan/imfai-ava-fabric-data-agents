---
project_name: "Reference-SaÃºde"
project_id: "reference-healthcare-001"
description: "Healthcare Analytics Platform Modernization - Data Migration to Microsoft Fabric"
organization: "saude"
target_platform: "fabric"  # fabric | databricks
migration_scope: "Full modernization: SQL Server â†’ Microsoft Fabric Medallion (Bronze/Silver/Gold)"

# Wave Configuration
wave_number: 1
wave_name: "Reference-Saúde Discovery & Design"
wave_start_date: "2026-06-05"
wave_target_completion: "2026-08-30"

# Ownership & RACI
discovery_owner: "discovery-scout"
architecture_owner: "data-architect"
data_model_owner: "data-modeler"
business_analyst_owner: "business-analyst"
code_generator_owner: "code-generator"
quality_gate_owner: "quality-gate"

# Source & Target
source:
  platform: "sql-server"
  description: "Legacy SQL Server (27 databases, 2,641 tables)"
  databases:
    - dwsaude
    - dwstage
    - bi_ods
    - bi_stage
    - dwmkt02
    - dwmkt03
    - sandbox

target:
  platform: "fabric"
  workspace: "Reference-Saúde-dev"
  capacity_tier: "premium"

# Phasing
phases:
  - phase: 1
    name: "Discovery & Architecture"
    gates: [gate-1]
    agents: [discovery-scout, data-architect, business-analyst]
    duration_weeks: 2
    
  - phase: 2
    name: "Design & Code Generation"
    gates: [gate-2]
    agents: [data-modeler, business-analyst, code-generator]
    duration_weeks: 4
    
  - phase: 3
    name: "Execution & Validation"
    gates: [gate-3]
    agents: [downstream-executor, reconciliation, quality-gate]
    duration_weeks: 4

# Quality Gates
gates:
  gate-1:
    name: "Discovery & Architecture Review"
    min_score: 0.85
    criteria:
      - completude: 0.90
      - architecture_clarity: 0.85
      - risk_residual: 0.10
      - documentation: 0.85
      
  gate-2:
    name: "Design & Code Quality"
    min_score: 0.85
    criteria:
      - data_model_coverage: 0.95
      - sttm_completeness: 0.90
      - code_quality: 0.88
      - test_coverage: 0.80
      
  gate-3:
    name: "Execution & Reconciliation"
    min_score: 0.90
    criteria:
      - row_count_parity: 0.999
      - schema_match: 1.00
      - data_quality_score: 0.95
      - performance_baseline: 0.90

# Discovery Scope
discovery:
  dw_scripts_path: "projects/Reference-Saúde/legacy/dw-scripts-extracted"
  emr_scripts_path: "projects/Reference-Saúde/legacy/emr-scripts-extracted"
  scan_depth: "full"
  entity_estimation: "2641"
  
# Output Paths
outputs:
  base_path: "projects/Reference-Saúde/outputs"
  phase_1: "phase-1"
  phase_2: "phase-2"
  phase_3: "phase-3"
  reports: "reports"
  artifacts:
    discovery: "DISCOVERY-REPORT.md"
    architecture: "ARCHITECTURE-DESIGN.md"
    data_model: "DATA-MODEL.md"
    sttm: "SOURCE-TARGET-MAPPING.md"
    code: "DDL-ETL-GENERATION.md"
    gate_reports: "GATE-{N}-REPORT.md"
    reconciliation: "RECONCILIATION-REPORT.md"

# Governance
governance:
  pii_fields: ["patient_id", "mrn", "cpf", "name", "email", "phone"]
  classification:
    - layer: "landing"
      sensitivity: "raw"
    - layer: "bronze"
      sensitivity: "internal"
    - layer: "silver"
      sensitivity: "confidential"
    - layer: "gold"
      sensitivity: "restricted"
  
  dq_rules_catalog: "projects/Reference-Saúde/outputs/phase-2/DQ-RULES.yaml"
  data_contracts_catalog: "projects/Reference-Saúde/outputs/phase-2/DATA-CONTRACTS.yaml"

# KPIs & Metrics
kpis:
  - metric: "schema_accuracy"
    target: 0.99
    measurement: "regex_extraction_vs_profiler"
    
  - metric: "lineage_coverage"
    target: 0.95
    measurement: "documented_transformations / total_transformations"
    
  - metric: "cost_reduction"
    target: 0.60
    measurement: "legacy_annual_cost / fabric_annual_cost"
    
  - metric: "time_to_value"
    target: 10
    measurement: "days_from_source_to_analytics"

# Milestones
milestones:
  - name: "Wave Planning"
    date: "2026-06-05"
    status: "complete"
    
  - name: "Phase 1: Discovery (Gate 1)"
    date: "2026-06-19"
    status: "in-progress"
    
  - name: "Phase 2: Design (Gate 2)"
    date: "2026-07-17"
    status: "pending"
    
  - name: "Phase 3: Execution (Gate 3)"
    date: "2026-08-14"
    status: "pending"
    
  - name: "Cutover & Hypercare"
    date: "2026-08-30"
    status: "pending"

# Risk & Assumptions
assumptions:
  - "SQL Server access available throughout migration"
  - "Fabric capacity provisioned by Week 1"
  - "Data stewards available for data quality validation"
  - "No schema changes in source during migration"

risks:
  - risk: "Data loss during migration"
    likelihood: "low"
    impact: "critical"
    mitigation: "Dual-run 6 weeks + automated parity checks"
    
  - risk: "Performance regression"
    likelihood: "medium"
    impact: "high"
    mitigation: "Early benchmarking + tuning + caching layer"
    
  - risk: "Skill gap (Spark/Python)"
    likelihood: "medium"
    impact: "medium"
    mitigation: "CoE + external training partner"
