<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} | Consultoria DMF Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        :root {
            --ava-orange: #FF5800;
            --ava-magenta: #CE0569;
            --ava-red: #C80000;
            --ava-gold: #FFB314;
            --ava-purple: #890078;
            --ava-green: #47800A;
            --ava-dark: #2D2D2D;
            --ava-gray: #595959;
            --ava-light: #E7E6E6;
            --bg-body: #FAFAFA;
            --text-primary: #1A1A1A;
            --text-secondary: #5A5A5A;
            --f1: #C80000;
            --f2: #0057B8;
            --f3: #890078;
            --f4: #05A870;
            --f5: #47800A;
            --f6: #FFB314;
            --f7: #FF5800;
            --f8: #2D2D2D;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #1a0a00 0%, #3d1700 30%, var(--ava-orange) 100%);
            padding: 48px 56px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -80px;
            right: -40px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(255, 88, 0, 0.25) 0%, transparent 55%);
            border-radius: 50%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .brand-logo img {
            height: 40px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .brand-divider {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.3);
        }

        .brand-product h2 {
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 900;
        }

        .brand-product p {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 1px;
        }

        .header-date {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 24px;
            font-size: 12px;
            opacity: 0.85;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-content h1 {
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 36px;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .header-content h1 span {
            color: var(--ava-gold);
        }

        .header-content p {
            font-size: 15px;
            opacity: 0.7;
            max-width: 640px;
        }

        /* ===== MAIN ===== */
        .main {
            max-width: 1520px;
            margin: 0 auto;
            padding: 44px;
        }

        .section-title {
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--ava-dark);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, var(--ava-orange), transparent);
        }

        .section-icon {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--ava-orange);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        /* ===== KPI GRID ===== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
            gap: 18px;
            margin-bottom: 48px;
        }

        .kpi-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05);
            border-top: 4px solid var(--ava-light);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.09);
        }

        .kpi-card.c-orange { border-top-color: var(--ava-orange); }
        .kpi-card.c-magenta { border-top-color: var(--ava-magenta); }
        .kpi-card.c-red { border-top-color: var(--ava-red); }
        .kpi-card.c-gold { border-top-color: var(--ava-gold); }
        .kpi-card.c-purple { border-top-color: var(--ava-purple); }
        .kpi-card.c-green { border-top-color: var(--ava-green); }
        .kpi-card.c-blue { border-top-color: #0057B8; }
        .kpi-card.c-dark { border-top-color: var(--ava-dark); }
        .kpi-card.c-teal { border-top-color: #05A870; }

        .kpi-value {
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 42px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
        }

        .kpi-card.c-orange .kpi-value { color: var(--ava-orange); }
        .kpi-card.c-magenta .kpi-value { color: var(--ava-magenta); }
        .kpi-card.c-red .kpi-value { color: var(--ava-red); }
        .kpi-card.c-gold .kpi-value { color: #c88800; }
        .kpi-card.c-purple .kpi-value { color: var(--ava-purple); }
        .kpi-card.c-green .kpi-value { color: var(--ava-green); }
        .kpi-card.c-blue .kpi-value { color: #0057B8; }
        .kpi-card.c-dark .kpi-value { color: var(--ava-dark); }
        .kpi-card.c-teal .kpi-value { color: #05A870; }

        .kpi-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .kpi-sub {
            font-size: 10px;
            color: #999;
            margin-top: 3px;
        }

        /* ===== MERMAID ===== */
        .mermaid-section {
            margin-bottom: 48px;
            background: white;
            border-radius: 18px;
            padding: 36px 28px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .mermaid-section .mermaid {
            display: flex;
            justify-content: center;
        }

        .mermaid-section .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        /* ===== PHASE BLOCKS ===== */
        .phase-block {
            background: white;
            border-radius: 18px;
            margin-bottom: 22px;
            box-shadow: 0 2px 14px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .phase-block-header {
            padding: 18px 26px;
            color: white;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            user-select: none;
        }

        .phase-badge-lg {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 16px;
            flex-shrink: 0;
        }

        .phase-title-area {
            flex: 1;
        }

        .phase-title-area h3 {
            font-family: 'Segoe UI Black', 'Segoe UI', sans-serif;
            font-size: 17px;
            font-weight: 900;
        }

        .phase-title-area p {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 2px;
        }

        .phase-counts {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .count-pill {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 18px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .chevron {
            font-size: 16px;
            transition: transform 0.3s;
        }

        .phase-block.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .phase-block.collapsed .phase-content {
            display: none;
        }

        .phase-content {
            padding: 0 26px 26px;
        }

        /* ===== AGENT CARDS ===== */
        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 14px;
        }

        .agent-card {
            border-radius: 12px;
            border: 1px solid #E9E5E0;
            padding: 18px;
            background: #FEFEFE;
            border-left: 4px solid var(--ava-light);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .agent-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .agent-card.is-orch {
            background: linear-gradient(135deg, #FFFBF7, #FFF5EE);
            border-left-color: var(--ava-orange);
        }

        .agent-card.is-sec {
            border-left-color: var(--ava-red);
        }

        .agent-card.is-build {
            border-left-color: var(--ava-green);
        }

        .agent-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .agent-desc {
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .agent-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }

        .tag-input { background: #FFF0E6; color: #9a3412; }
        .tag-output { background: #E8F5E0; color: #2d5016; }
        .tag-trigger { background: #F5E6FF; color: #581c87; }
        .tag-tool { background: #E6F0FF; color: #1e3a5f; }

        /* ===== TABLES ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        table thead {
            background: linear-gradient(135deg, var(--ava-purple), var(--ava-magenta));
            color: white;
        }

        table th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        table td {
            padding: 14px 16px;
            border-bottom: 1px solid #EEE;
        }

        table tbody tr:hover {
            background: #F8F8F8;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: linear-gradient(135deg, #1a0a00, #3d1700, var(--ava-orange));
            color: white;
            text-align: center;
            padding: 32px;
            font-size: 12px;
        }

        .footer .brand-color {
            color: var(--ava-gold);
        }

        .footer .sub {
            opacity: 0.5;
            font-size: 10px;
            margin-top: 6px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header {
                padding: 32px 24px;
            }

            .header-content h1 {
                font-size: 28px;
            }

            .main {
                padding: 24px;
            }

            .kpi-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
            }

            .agents-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 12px;
            }

            table th, table td {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <div class="header">
        <div class="header-top">
            <div class="brand">
                <div class="brand-product">
                    <h2>DMF</h2>
                    <p>Data Migration Factory</p>
                </div>
            </div>
            <div class="header-date">Gerado: {{DATE}}</div>
        </div>
        <div class="header-content">
            <h1>{{TITLE}}</h1>
            <p>{{SUBTITLE}}</p>
        </div>
    </div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="main">

        <!-- KPI Section -->
        {{#if KPI_DATA}}
        <div class="section-title"><div class="section-icon">📊</div> Indicadores-Chave de Desempenho</div>
        <div class="kpi-grid">
            {{KPI_CARDS}}
        </div>
        {{/if}}

        <!-- Content Area -->
        {{CONTENT}}

    </div>

    <!-- ========== FOOTER ========== -->
    <div class="footer">
        <strong class="brand-color">DMF</strong> &mdash; Data Migration Factory<br>
        <span class="sub">Powered by DMF Fabric Agents &middot; Consultoria &middot; {{FOOTER_TEXT}}</span>
    </div>

    <script>
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            themeVariables: {
                primaryColor: '#FFF5EE',
                primaryBorderColor: '#FF5800',
                primaryTextColor: '#2D2D2D',
                lineColor: '#FFB314',
                secondaryColor: '#F5E6FF',
                tertiaryColor: '#E8F5E0'
            },
            flowchart: {
                curve: 'basis',
                nodeSpacing: 25,
                rankSpacing: 40
            }
        });

        function togglePhase(el) {
            el.parentElement.classList.toggle('collapsed');
        }
    </script>
</body>
</html>
