# DataFlow Agent Configuration
# Phase: DOWNSTREAM | Gate: 3

markdownExploder: true

# Gate Integration
gate_settings:
  phase: DOWNSTREAM
  gate: 3
  requires_gate_2: true
  upstream_agents:
    - data-architect
    - data-steward
    - business-analyst
  downstream_agents:
    - orchestrator
  artifacts:
    produces:
      - ddl-scripts.sql
      - etl-scripts.sql
      - data-tests.sql
      - pipeline-doc.md
    requires:
      - architecture.md
      - data-model.md
      - dq-rules.md
      - sttm.md

projectContext:
  contextFolder: context
  legacyCodePath: context/codigo-legado
  normativePath: context/normativa-cnpj
qa:
  qaLocation: docs/qa
prd:
  prdFile: docs/prd.md
  prdVersion: v4
  prdSharded: true
  prdShardedLocation: docs/prd
  epicFilePattern: epic-{n}*.md
architecture:
  architectureFile: docs/architecture.md
  architectureVersion: v4
  architectureSharded: true
  architectureShardedLocation: docs/architecture
customTechnicalDocuments: null
devLoadAlwaysFiles:
  - docs/architecture/coding-standards.md
  - docs/architecture/tech-stack.md
  - docs/architecture/source-tree.md
devDebugLog: .ai/debug-log.md
devStoryLocation: docs/stories
slashPrefix: Avanade
