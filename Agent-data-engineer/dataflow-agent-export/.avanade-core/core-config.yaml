# Architecture Patterns
architecture:
  medallion:
    landing:
      alias: "Bronze"
      schema_prefix: "LND"
      purpose: "Raw data ingestion, VARCHAR columns"
      principles:
        - "Preserve source data exactly as received"
        - "All columns as VARCHAR for flexibility"
        - "Include audit columns (load_timestamp, source_file)"
        
    silver:
      schema_prefix: "SILVER"
      purpose: "Typed, validated, quality-checked data"
      principles:
        - "Proper data types applied"
        - "Data quality flags (VALID/INVALID)"
        - "Reject records captured separately"
        - "Business rules validated"
        
    gold:
      schema_prefix: "GOLD"
      purpose: "Business-ready, enriched, aggregated data"
      principles:
        - "Only VALID records from Silver"
        - "Denormalized for query performance"
        - "Business KPIs and metrics"
        - "Ready for analytics/reporting"
        
    reference:
      schema_prefix: "REF"
      purpose: "Lookup and dimension tables"

# Supported Technologies
technologies:
  languages:
    - SQL (T-SQL, PL/SQL, SparkSQL)
    - Python (PySpark)
    - Scala (Spark)
    
  platforms:
    - Azure Synapse Analytics
    - Azure Databricks
    - Azure Data Factory
    - Microsoft Fabric
    - SQL Server
    
  file_formats:
    - CSV (Comma-Separated Values)
    - TSV (Tab-Separated Values)
    - Parquet (Columnar Storage)
    - JSON (Structured/Semi-structured)
    - Avro, ORC, Delta Lake

# Data Quality Framework
dataQuality:
  validation_types:
    - type_validation: "Ensure correct data types"
    - null_checks: "Validate required fields"
    - range_validation: "Check numeric ranges"
    - referential_integrity: "Validate foreign keys"
    - business_rules: "Apply domain-specific rules"
    - format_validation: "Check patterns (email, phone)"
    - duplicate_detection: "Identify duplicate records"
    
  quality_flags:
    - VALID: "Passed all quality checks"
    - INVALID: "Failed one or more checks"
    - SUSPECT: "Warning, requires review"

