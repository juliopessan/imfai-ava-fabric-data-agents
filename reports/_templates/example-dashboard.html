<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 Example Dashboard | Consultoria</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"><\/script>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* VARIABLES */
        :root {
            --color-primary-orange: #ff6b35;
            --color-accent-orange: #f7931e;
            --color-primary-blue: #1f3a93;
            --color-dark-blue: #0f1d4d;
            --color-light-bg: #f9f9f9;
            --color-white: #ffffff;
            --color-border: #e0e0e0;
            --color-text-primary: #333333;
            --color-text-secondary: #666666;
            --color-text-tertiary: #999999;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.15);
            
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            --spacing-2xl: 48px;
            
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* BODY & LAYOUT */
        body {
            font-family: var(--font-family);
            background: var(--color-light-bg);
            color: var(--color-text-primary);
            padding: var(--spacing-lg);
            min-height: 100vh;
            line-height: 1.6;
        }

        .page-wrapper {
            max-width: 1600px;
            margin: 0 auto;
        }

        .container {
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            margin-bottom: var(--spacing-xl);
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, var(--color-primary-orange) 0%, var(--color-accent-orange) 100%);
            padding: var(--spacing-2xl) var(--spacing-lg);
            color: var(--color-white);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .header h1 {
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
            position: relative;
            z-index: 1;
            letter-spacing: -0.5px;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-weight: 400;
            margin-bottom: var(--spacing-lg);
        }

        .header .metadata {
            margin-top: var(--spacing-lg);
            font-size: 0.9em;
            position: relative;
            z-index: 1;
            opacity: 0.85;
            line-height: 1.8;
        }

        .header .metadata strong {
            font-weight: 600;
            opacity: 1;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            color: var(--color-white);
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: 20px;
            margin-top: var(--spacing-md);
            font-weight: 600;
            font-size: 0.95em;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* CONTENT */
        .content {
            padding: var(--spacing-2xl);
        }

        .section {
            margin-bottom: var(--spacing-2xl);
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--color-primary-blue);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 3px solid var(--color-primary-orange);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            letter-spacing: -0.3px;
        }

        /* GRIDS */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-lg);
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--spacing-lg);
        }

        @media (max-width: 1200px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4, .kpi-grid {
                grid-template-columns: 1fr;
            }
            .header {
                padding: var(--spacing-lg) var(--spacing-md);
            }
            .header h1 {
                font-size: 1.8em;
            }
            .content {
                padding: var(--spacing-lg);
            }
        }

        /* CARDS */
        .kpi-card {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .kpi-card:hover {
            border-color: var(--color-primary-orange);
            box-shadow: var(--shadow-md);
            transform: translateY(-4px);
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.02) 0%, rgba(247, 147, 30, 0.02) 100%);
        }

        .kpi-value {
            font-size: 2.8em;
            font-weight: 700;
            color: var(--color-primary-orange);
            margin: var(--spacing-md) 0;
            line-height: 1.2;
        }

        .kpi-label {
            font-size: 0.9em;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .kpi-sublabel {
            font-size: 0.85em;
            color: var(--color-text-tertiary);
            margin-top: var(--spacing-sm);
            font-weight: 400;
        }

        /* CHARTS */
        .chart-container {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            position: relative;
            min-height: 300px;
        }

        .chart-container canvas {
            max-height: 400px;
        }

        /* TABLES */
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-lg);
            background: var(--color-white);
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .metrics-table thead {
            background: linear-gradient(135deg, var(--color-primary-blue) 0%, #0f1d4d 100%);
            color: var(--color-white);
        }

        .metrics-table th {
            padding: var(--spacing-md) var(--spacing-lg);
            text-align: left;
            font-weight: 600;
            font-size: 0.95em;
            letter-spacing: 0.5px;
        }

        .metrics-table td {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            font-size: 0.95em;
        }

        .metrics-table tbody tr:last-child td {
            border-bottom: none;
        }

        .metrics-table tbody tr:hover {
            background: var(--color-light-bg);
        }

        .metrics-table .tier {
            font-weight: 600;
            color: var(--color-primary-blue);
        }

        /* STATUS INDICATORS */
        .status-pass {
            color: #27ae60;
            font-weight: 600;
        }

        .status-fail {
            color: #e74c3c;
            font-weight: 600;
        }

        .status-warning {
            color: #f39c12;
            font-weight: 600;
        }

        .status-info {
            color: var(--color-primary-blue);
            font-weight: 600;
        }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            margin: 0 var(--spacing-xs);
            white-space: nowrap;
        }

        .badge-success {
            background: #d5f4e6;
            color: #27ae60;
        }

        .badge-info {
            background: #d6eaf8;
            color: var(--color-primary-blue);
        }

        .badge-warning {
            background: #fdebd0;
            color: #f39c12;
        }

        .badge-danger {
            background: #fadad1;
            color: #e74c3c;
        }

        /* RISK ITEMS */
        .risk-item {
            background: var(--color-light-bg);
            padding: var(--spacing-lg);
            border-left: 4px solid var(--color-primary-orange);
            margin-bottom: var(--spacing-md);
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
        }

        .risk-item:hover {
            box-shadow: var(--shadow-sm);
            transform: translateX(4px);
        }

        .risk-high {
            border-left-color: #e74c3c;
            background: #fadad1;
        }

        .risk-medium {
            border-left-color: #f39c12;
            background: #fdebd0;
        }

        .risk-low {
            border-left-color: #27ae60;
            background: #d5f4e6;
        }

        .risk-title {
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            font-size: 0.95em;
        }

        .risk-description {
            font-size: 0.9em;
            line-height: 1.5;
        }

        /* FOOTER */
        .footer {
            background: var(--color-light-bg);
            padding: var(--spacing-lg) var(--spacing-2xl);
            text-align: center;
            color: var(--color-text-tertiary);
            font-size: 0.9em;
            border-top: 1px solid var(--color-border);
        }

        .footer strong {
            color: var(--color-text-secondary);
            font-weight: 600;
        }

        /* UTILITIES */
        .text-center { text-align: center; }
        .text-right { text-align: right; }

    </style>
</head>
